server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # API → Backend
    location /api/ {
        proxy_pass https://vokabeltrainer-backend.onrender.com;
        proxy_ssl_server_name on;
    }

    # Frontend Routing
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}